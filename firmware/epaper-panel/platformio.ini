; PlastiBytes ePaper panel: Seeed XIAO 7.5" ePaper Panel (XIAO ESP32-C3, UC8179 800x480)
[env:xiao_epaper]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Seeed_GFX: 7.5" monochrome UC8179 on the XIAO ePaper driver board
    -DBOARD_SCREEN_COMBO=502
    -DUSE_XIAO_EPAPER_DRIVER_BOARD
; WifiStore (last 5 networks) and xiaozhi-mcp (see VENDORED.md) are shared with the bulb
lib_extra_dirs = ../shared-libs
lib_deps =
    ; pinned commit
    https://github.com/Seeed-Studio/Seeed_Arduino_LCD.git#0dfdd7135425be82b5bb4b4b58d74dd51ab29a59
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
