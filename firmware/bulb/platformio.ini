; PlastiBytes smart bulb: XIAO ESP32-C3 + presence sensor (D2) + relay (D3) switching a mains lamp
[env:xiao_bulb]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
; WifiStore (last 5 networks) and xiaozhi-mcp are shared with the ePaper panel
lib_extra_dirs = ../shared-libs
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
